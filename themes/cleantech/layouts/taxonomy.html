{{ define "main" }}
  <div class="taxonomy-container">
    <h1 class="section-title">{{ .Title }}</h1>
    <div class="taxonomy-list">
      {{ range .Pages }}
        <a href="{{ .RelPermalink }}" class="taxonomy-item">
          {{ .LinkTitle }}
          <span class="taxonomy-count">({{ len .Pages }})</span>
        </a>
      {{ end }}
    </div>
  </div>
{{ end }}
