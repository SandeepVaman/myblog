{{- $kind := . -}}
{{- if eq $kind "stack" -}}
<svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <rect x="40" y="40" width="220" height="22" fill="none" stroke="#1c1a17" stroke-width="1.5"/>
  <rect x="40" y="72" width="220" height="22" fill="none" stroke="#1c1a17" stroke-width="1.5"/>
  <rect x="40" y="104" width="220" height="22" fill="#8a3324" opacity="0.92"/>
  <rect x="40" y="136" width="220" height="22" fill="none" stroke="#1c1a17" stroke-width="1.5"/>
</svg>
{{- else if eq $kind "ring" -}}
<svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <circle cx="150" cy="100" r="70" fill="none" stroke="#1c1a17" stroke-width="1.5"/>
  <circle cx="150" cy="100" r="44" fill="none" stroke="#1c1a17" stroke-width="1.5"/>
  <circle cx="150" cy="100" r="18" fill="#8a3324"/>
  <line x1="150" y1="30" x2="150" y2="170" stroke="#c9bfa8" stroke-width="1"/>
</svg>
{{- else if eq $kind "graph" -}}
<svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <line x1="80" y1="60" x2="150" y2="120" stroke="#1c1a17" stroke-width="1"/>
  <line x1="220" y1="50" x2="150" y2="120" stroke="#1c1a17" stroke-width="1"/>
  <line x1="60" y1="150" x2="150" y2="120" stroke="#1c1a17" stroke-width="1"/>
  <line x1="240" y1="140" x2="150" y2="120" stroke="#1c1a17" stroke-width="1"/>
  <line x1="80" y1="60" x2="220" y2="50" stroke="#c9bfa8" stroke-width="1" stroke-dasharray="2 4"/>
  <circle cx="80" cy="60" r="6" fill="#1c1a17"/>
  <circle cx="220" cy="50" r="6" fill="#1c1a17"/>
  <circle cx="150" cy="120" r="6" fill="#8a3324"/>
  <circle cx="60" cy="150" r="6" fill="#1c1a17"/>
  <circle cx="240" cy="140" r="6" fill="#1c1a17"/>
</svg>
{{- else if eq $kind "wave" -}}
<svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <path d="M 0 110 Q 50 60 100 110 T 200 110 T 300 110" fill="none" stroke="#1c1a17" stroke-width="1.5"/>
  <path d="M 0 130 Q 50 80 100 130 T 200 130 T 300 130" fill="none" stroke="#c9bfa8" stroke-width="1"/>
  <path d="M 0 90 Q 50 40 100 90 T 200 90 T 300 90" fill="none" stroke="#8a3324" stroke-width="1.5"/>
</svg>
{{- else if eq $kind "grid" -}}
<svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  {{- range $i := seq 0 4 }}
    {{- range $j := seq 0 7 }}
      <rect x="{{ add 20 (mul $j 34) }}" y="{{ add 20 (mul $i 34) }}" width="20" height="20"
        fill="{{ if eq (add $i $j) 5 }}#8a3324{{ else }}none{{ end }}"
        stroke="#1c1a17" stroke-width="1"/>
    {{- end }}
  {{- end }}
</svg>
{{- else -}}
<svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <line x1="40" y1="100" x2="240" y2="100" stroke="#1c1a17" stroke-width="1.5"/>
  <polyline points="220,80 240,100 220,120" fill="none" stroke="#1c1a17" stroke-width="1.5"/>
  <line x1="60" y1="60" x2="100" y2="60" stroke="#c9bfa8" stroke-width="1"/>
  <line x1="60" y1="140" x2="120" y2="140" stroke="#c9bfa8" stroke-width="1"/>
  <circle cx="40" cy="100" r="4" fill="#8a3324"/>
</svg>
{{- end -}}
