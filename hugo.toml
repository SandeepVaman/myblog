baseURL = 'https://tech.notesbysandeep.com'
languageCode = 'en-us'
title = 'Build Log'
theme = 'tech-notes'
enableRobotsTXT = true

# Pagination
[pagination]
  pagerSize = 10

# Taxonomies
[taxonomies]
  playlist = 'playlists'

# Syntax highlighting
[markup]
  [markup.highlight]
    style = 'dracula'
    lineNos = false
    guessSyntax = true
    noClasses = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
  [markup.goldmark.renderer]
    unsafe = true

# Menu
[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10

  [[menus.main]]
    name = 'Posts'
    pageRef = '/posts'
    weight = 20

  [[menus.main]]
    name = 'Playlists'
    pageRef = '/playlists'
    weight = 30

  [[menus.main]]
    name = 'About'
    pageRef = '/about'
    weight = 40

# Site params
[params]
  homeTitle = 'Build Log — Database Internals & Distributed Systems by Sandeep'
  description = 'Deep technical articles about database internals, distributed systems, Rust, BoltDB, B+trees, MVCC, and storage engines.'
  author = 'Sandeep'
  authorURL = '/about/'
  defaultImage = '/images/social-card.png'
  defaultImageAlt = 'Build Log — database internals, distributed systems, and Rust'
  defaultImageWidth = 1732
  defaultImageHeight = 908
  since = '2026'
  # Add the verification token from Google Search Console when the property is created.
  # googleSiteVerification = 'verification-token'

  [params.social]
    github = 'SandeepVaman'
    twitter = 'sandeepvbujire'
    linkedin = 'sandeep-vb-335b8097'
